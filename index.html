<script>
const K=['date','time','pair','dir','strat','cond','entry','sl','tp','exit','lot','pl','emo','mist','htf','bos','liq','swp'];
const SEED=[].map(a=>Object.fromEntries(K.map((k,i)=>[k,a[i]])));
const L={pair:['XAUUSD','EURUSD','NASDAQ','S&P500'],dir:['Buy','Sell'],sess:['','Asia','London','New York','Overlap'],strat:['AMN MODEL','LEGACY'],cond:['Trending','Ranging','High Volatility','Low Volatility'],emo:['Calm','Confident','Patient','Brave','FOMO','Fear','Greed','Revenge','Hesitation'],mist:['None','FOMO Entry','Late Entry','Against HTF Bias','RR Below 2','News Trade','Overtaking','Moved Stop Loss','Emotional Exit','Revenge Trade','Entered Before Trigger','Wick/Body Rule Broken','SL Not at Wick End','Other']};
const FS=[['date','Date','date'],['time','Open time (MT5)','time'],['ctime','Close time (MT5)','time'],['pair','Pair','sel'],['dir','Direction','sel'],['strat','Strategy','sel'],['cond','Market condition','sel'],['emo','Emotion','sel'],['entry','Entry price','num'],['sl','Stop loss','num'],['tp','Take profit','num'],['exit','Exit price','num'],['lot','Lot size','num'],['pl','Profit / Loss ($)','num'],['mist','Mistake','sel']];
const CK=[['htf','Context'],['bos','Zone'],['liq','Trigger'],['swp','Risk']];
const RK=[['swp','SL at the end of the wick'],['swp','TP at 1:2']];
const AMN=[
['htf','Trend on the 15m is clear (HH/HL or LH/LL) and I trade with it',1],
['htf','BOS: a candle body closed beyond the last swing high/low',1],
['bos','Fibonacci drawn on the swing that made the BOS (zone 0.5 to 0.786)',1],
['bos','Price left the BOS and pulled back into the zone',1],
['bos','The previous BOS level (liquidity) is inside the zone',1],
['liq','A wick swept the previous BOS level while inside the zone',1],
['liq','The sweep candle has closed, so I can enter on the 5m',0],
['swp','SL at the end of the sweep wick',2],
['swp','TP at exactly 1:2 and the lot size fits my risk limit',2]];
const BON=['The sweep wick is clear and strong','The 15m and 5m agree','The zone is clean, with no messy candles'];
const STR={
'AMN MODEL':AMN.map(([g,l])=>[g,l]),
'LEGACY':CK.map(([k,l])=>[k,l])};
function renderChecks(st,v){$('checks').innerHTML='<div class="k" style="margin-top:10px">Rules checklist</div>'+(STR[st]||STR.LEGACY).map(([g,l])=>'<label class="chk"><input type="checkbox" class="st" data-g="'+g+'"'+(v&&v[g]?' checked':'')+'>'+l+'</label>').join('')}
const MS={'Liquidity Sweep':'AMN MODEL'},MM={'No Liquidity Sweep':'Entered Before Trigger','Ignored BOS':'Entered Before Trigger','Early Entry':'Entered Before Trigger'};
const mig=t=>{const n={...t};if(MS[n.strat])n.strat=MS[n.strat];else if(n.strat&&!L.strat.includes(n.strat))n.strat='LEGACY';if(MM[n.mist])n.mist=MM[n.mist];return n};
const SF=[['name','Account name','text'],['start','Starting balance','number'],['daily','Daily goal','number'],['weekly','Weekly goal','number'],['monthly','Monthly goal','number'],['risk','Max risk % per trade','number'],['maxt','Max trades per day','number'],['maxloss','Max daily loss % of balance','number']];
const MULT={XAUUSD:100,EURUSD:100000};
let S={name:'My Trading Account',start:50,daily:5,weekly:25,monthly:70,risk:10,maxt:3,maxloss:20},T=[],W=[],editId=null,idbOK=true;
const $=i=>document.getElementById(i);
const idb=new Promise((res,rej)=>{try{const r=indexedDB.open('tj',3);r.onupgradeneeded=()=>{const d=r.result,n=d.objectStoreNames;if(!n.contains('trades'))d.createObjectStore('trades',{keyPath:'id',autoIncrement:true});if(!n.contains('kv'))d.createObjectStore('kv');if(!n.contains('wd'))d.createObjectStore('wd',{keyPath:'id'});if(!n.contains('shots'))d.createObjectStore('shots',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const tx=async(st,mode,fn)=>{if(!idbOK)return;try{const d=await idb;return await new Promise((res,rej)=>{const t=d.transaction(st,mode),q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}catch(e){idbOK=false}};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const net=()=>W.reduce((s,w)=>s+(w.dep?-w.amt:w.amt),0);
const f=n=>(n<0?'-':'')+'$'+Math.abs(n).toFixed(2),cls=n=>n>0?'win':n<0?'loss':'mut';
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
const mn=v=>{if(!v)return null;const[h,m]=v.split(':').map(Number);return isNaN(h)||isNaN(m)?null:h*60+m},durMin=(a,b)=>{const x=mn(a),y=mn(b);if(x==null||y==null)return null;let d=y-x;if(d<0)d+=1440;return d},fmtD=m=>m<60?m+'m':Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
const sessOf=tm=>{if(!tm)return'';const[h,m]=tm.split(':').map(Number),x=h*60+m,a=x>=300&&x<900,l=x>=900,n=x>=1200||x<300,c=a+l+n;return c>1?'Overlap':a?'Asia':l?'London':n?'New York':''};
function dayState(R){const ds=ymd(new Date()),bal=S.start+R.reduce((s,t)=>s+t.pl,0)-net(),mxl=bal*S.maxloss/100,dl=-R.filter(t=>t.date===ds&&t.pl<0).reduce((s,t)=>s+t.pl,0),a=R.filter(t=>t.date===ds).length;return{mxl,dl,ok:dl<mxl,full:a>=S.maxt}}
function calc(){const rows=[...T].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));let eq=S.start,pk=S.start,w=0,l=0;const cnt={};
 return rows.map(t=>{const m=MULT[t.pair],ok=m&&t.entry!=null&&t.sl!=null&&t.lot,risk=ok?Math.abs(t.entry-t.sl)*t.lot*m:null;
 const rr=t.entry!=null&&t.sl!=null&&t.tp!=null&&t.entry!==t.sl?Math.abs(t.tp-t.entry)/Math.abs(t.entry-t.sl):null;
 const rp=risk&&eq>0?risk/eq:null,res=t.pl>0?'Win':t.pl<0?'Loss':'BE';w=res==='Win'?w+1:0;l=res==='Loss'?l+1:0;eq+=t.pl;pk=Math.max(pk,eq);
 const sc=[t.htf,t.bos,t.liq,t.swp].filter(Boolean).length*25;
 const dn=(cnt[t.date]=(cnt[t.date]||0)+1),rsc=((rp!=null&&rp<=S.risk/100)+(t.mist==='None')+(dn<=S.maxt)+(sc>=75))/4;
 return{...t,dur:durMin(t.time,t.ctime),rsc,fol:rsc>=.75?'Yes':'No',sess:sessOf(t.time),risk,rp,rr,res,R:risk?t.pl/risk:null,score:sc,q:sc>=100?'A+':sc>=75?'A':sc>=50?'B':sc>=25?'C':'D',w,l,eq,dd:(pk-eq)/pk}})}
const sumD=(R,fn)=>R.filter(t=>fn(t.date)).reduce((s,t)=>s+t.pl,0);
function mission(R){const now=new Date(),dow=now.getDay();if(dow===0||dow===6)return{closed:true};
 const ds=ymd(now),target=S.daily,n=sumD(R,x=>x===ds),a=R.filter(t=>t.date===ds).length;return{target,mode:'Daily',n,a,rem:target-n}}
function renderStrat(R){const rows=L.strat.slice(0,1).map(nm=>{const g=R.filter(x=>x.strat===nm),n=g.length,p=g.reduce((s,x)=>s+x.pl,0),wp=n?Math.round(g.filter(x=>x.pl>0).length/n*100):0,rs=g.filter(x=>x.R!=null),ar=rs.length?rs.reduce((s,x)=>s+x.R,0)/rs.length:null;return{nm,n,p,wp,ar}}),ok=rows.filter(r=>r.n>=10),best=ok.length?ok.reduce((a,b)=>b.p>a.p?b:a):null;
 $('strat').innerHTML='<h2>Strategy scorecard</h2>'+rows.map(r=>'<div class="tr" style="cursor:default"><span>'+r.nm+'<span class="tag">'+(r.n<10?r.n+'/10 trades':r.n+' trades')+'</span>'+(r.n?'<span class="tag">'+r.wp+'%</span><span class="tag">'+(r.ar==null?'–':r.ar.toFixed(2)+'R')+'</span>':'')+'</span><b class="'+cls(r.p)+'">'+(r.n?f(r.p):'–')+'</b></div>').join('')+'<div class="mut" style="margin-top:8px;font-size:13px">'+(best?'Best so far: '+best.nm:'Wait for 10 AMN MODEL trades before judging it.')+'</div>'}
const pick=a=>a[Math.floor(Date.now()/864e5)%a.length];
function renderHome(R,m,wsum){
 const now=new Date(),ds=ymd(now),dw=now.getDay()||7,mo=new Date(now);mo.setDate(now.getDate()-(dw-1));const ms=ymd(mo),lw=new Date(mo);lw.setDate(mo.getDate()-7);const ls=ymd(lw),el=$('mission');
 if(m.closed)el.innerHTML=`<h2>Today's Mission</h2><div class="big">The market is closed today.</div><div class="mut" style="margin-top:6px">Rest, review your trades, and come back sharp on Monday.</div>`;
 else{const done=m.rem<=1e-9,left=Math.max(S.maxt-m.a,0),fail=!done&&left===0,p=l=>Math.round(m.rem*10/(l/0.01));let head,sub;
  if(done){head=`Mission complete. You hit your ${f(m.target)} target today.`;sub=pick([`Protect it. There is no need to force another trade.`,`Close the chart and enjoy it. Discipline wins days like this.`])}
  else if(fail){head=`Today did not go your way, and all ${S.maxt} attempts are used.`;sub=`Stop here, review what happened, and come back tomorrow with a clear head.`}
  else{head=`Hey trader, today's target is ${f(m.target)}. Do you think you can get it?`;
   sub=(m.n>0?`You have collected ${f(m.n)} so far, ${f(m.rem)} to go.`:m.n<0?`You are down ${f(-m.n)} today, so ${f(m.rem)} is needed to reach the target.`:`Nothing collected yet. Wait for your setup.`)+` You have ${left} attempt${left>1?'s':''} left${left===1?'. Make it count':''}.`+` With 0.01 lot you need about ${p(0.01)} pips, with 0.02 lot about ${p(0.02)}.`}
  el.innerHTML=`<h2>Today's Mission</h2><div class="big" style="font-weight:600;line-height:1.3">${head}</div><div class="${done?'win':fail?'loss':'mut'}" style="margin-top:8px">${sub}</div><div class="dots">${Array.from({length:S.maxt},(_,i)=>'<div class="dot'+(i<m.a?' on':'')+'"></div>').join('')}</div>`}
 const tot=sumD(R,()=>true),bal=S.start+tot-wsum,wk=R.filter(t=>t.date>=ms),pw=R.filter(t=>t.date>=ls&&t.date<ms),rate=a=>a.filter(t=>t.pl>0).length/a.length;let wr;
 if(!R.length)wr=`Add your first trade and I will start tracking your win rate.`;
 else if(!wk.length)wr=`No trades yet this week. Be patient and wait for a clean setup.`;
 else if(!pw.length){const r=rate(wk);wr=r>=.6?`A strong start to the week. Most of your trades are winning.`:r>=.4?`Your results are mixed so far this week. Stay selective.`:`Most of your trades are losing this week. Slow down and wait for the full setup.`}
 else{const a=rate(wk),b=rate(pw);wr=a<b-.05?`Your win rate is decreasing this week compared to last week. Try to get one solid trade to keep up the momentum.`:a>b+.05?`Your win rate is improving this week compared to last week. Keep the same discipline.`:`Your win rate is holding steady compared to last week. Stay consistent.`}
 const say=(l,n,g)=>{const q=g>0?n/g:0,w=n<0?'in the red':q<=0?'not started yet':q<.25?'just getting started':q<.5?'making progress':q<.75?'past the halfway mark':q<1?'almost there':'goal reached';return`<div class="row"><span>${l}</span><b class="${n<0?'loss':q>=1?'win':''}">${w}</b></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,q*100))}%"></i></div>`};
 $('stats').innerHTML=`<h2>${esc(S.name)}</h2><div style="font-size:18px;line-height:1.35">${wr}</div><div class="mut" style="margin:8px 0 12px">Your balance is ${f(bal)}.</div>`+say('Today',sumD(R,d=>d===ds),S.daily)+say('This week',sumD(R,d=>d>=ms),S.weekly)+say('This month',sumD(R,d=>d.slice(0,7)===ds.slice(0,7)),S.monthly);
 const mxl=bal*S.maxloss/100,dl=-R.filter(t=>t.date===ds&&t.pl<0).reduce((s,t)=>s+t.pl,0),allowed=dl<mxl,rk=R.filter(t=>t.rp!=null).slice(-5),ra=rk.length?rk.reduce((s,t)=>s+t.rp,0)/rk.length:null,mm=S.risk/100,last=R[R.length-1];
 const rline=ra==null?`Add entry, stop loss and lot size to your trades so I can read your risk.`:ra<.5*mm?`Your recent risk per trade is small and safe. Trade normally.`:ra<mm?`Your recent risk is in a healthy range. Stay disciplined.`:ra<1.5*mm?`Your recent risk per trade is getting high. Consider reducing your position size.`:`Your recent risk per trade is too high. Stop trading today and reset.`;
 const dline=!allowed?`You have reached your daily loss limit. Trading is not allowed today. Stop here.`:dl>0?`You are down ${f(dl)} today, still inside your ${f(mxl)} limit. Protect your capital.`:`No losses today. You are free to trade within your limits.`;
 const sline=last?(last.l>=5?`You have lost five or more trades in a row. Step away and review before trading again.`:last.w>=5?`Five wins in a row. Stay humble and do not increase your risk.`:last.l>=3?`Three losses in a row. Slow down and wait for a perfect setup.`:last.w>=3?`Three wins in a row. Stay disciplined and do not get overconfident.`:''):'';
 $('risk').innerHTML=`<h2>Risk check</h2><div class="${allowed?'':'loss'}" style="font-size:16px">${dline}</div><div style="margin-top:8px">${rline}</div>${sline?`<div class="amb" style="margin-top:8px">${sline}</div>`:''}`;
 const g=R.filter(x=>x.strat==='AMN MODEL'),gp=g.reduce((s,x)=>s+x.pl,0);
 $('strw').innerHTML=`<h2>AMN Model</h2><div>${g.length<10?'I need 10 AMN MODEL trades before I can judge how sharp it is. Keep logging and follow every rule.':gp>0?'The AMN Model is profitable so far. Keep sharpening it and follow every rule.':'The AMN Model is not profitable yet. Review your losses and tighten the rules.'}</div><div class="mut" style="font-size:13px;margin-top:6px">The full numbers are in Analytics.</div>`}
function render(){const R=calc(),m=mission(R),el=$('mission'),wsum=net();renderAna(R);renderWd();renderStrat(R);
 renderHome(R,m,wsum);

function verdict(){const r=PRE.r,bn=PRE.b.filter(Boolean).length,n=r.filter(Boolean).length,score=Math.round(n*10+bn*10/3);
