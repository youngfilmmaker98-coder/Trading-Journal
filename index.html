<style>

[hidden]{display:none!important}
</style></head><body>
<div class="tabs"><button data-t="home" class="on">Home</button><button data-t="trades">Trades</button><button data-t="rev" id="rtab">Review</button><button data-t="ana">Analytics</button><button data-t="wd">Withdraw</button><button data-t="set">Settings</button></div>

<script>
const K=['date','time','pair','dir','strat','cond','entry','sl','tp','exit','lot','pl','emo','mist','htf','bos','liq','swp'];
const SEED=[].map(a=>Object.fromEntries(K.map((k,i)=>[k,a[i]])));
const L={pair:['XAUUSD','EURUSD','GBPUSD','USDJPY','NAS100','US30'],dir:['Buy','Sell'],sess:['','Asia','London','New York','Overlap'],strat:['AMN MODEL','VOLUME PROFILE 1','VOLUME PROFILE 2','VOLUME PROFILE 3','H&L LIQUIDITY GRAB','LEGACY'],cond:['Trending','Ranging','High Volatility','Low Volatility'],emo:['Calm','Confident','Patient','Brave','FOMO','Fear','Greed','Revenge','Hesitation'],mist:['None','FOMO Entry','Late Entry','Against HTF Bias','RR Below 2','News Trade','Overtaking','Moved Stop Loss','Emotional Exit','Revenge Trade','Entered Before Trigger','Wick/Body Rule Broken','SL Not at Wick End','Other']};
const FS=[['date','Date','date'],['time','Open time (MT5)','time'],['ctime','Close time (MT5)','time'],['pair','Pair','sel'],['dir','Direction','sel'],['strat','Strategy','sel'],['cond','Market condition','sel'],['emo','Emotion','sel'],['entry','Entry price','num'],['sl','Stop loss','num'],['tp','Take profit','num'],['exit','Exit price','num'],['lot','Lot size','num'],['pl','Profit / Loss ($)','num'],['mist','Mistake','sel']];

'AMN MODEL':[['htf','Identify the trend (uptrend / downtrend)'],['htf','Identify a valid break of structure'],['htf','Identify liquidity after the BOS'],['bos','Draw Fibonacci at the previous BOS'],['bos','Liquidity is inside the zone'],['liq','Price came back and took the liquidity'],['liq','Liquidity swept: enter'],...RK],

'VOLUME PROFILE 2':[['htf','Volume profile drawn on the previous day'],['htf','Price was inside the value area'],['htf','Price broke VAH or VAL'],['bos','Price pulled back into the zone'],['liq','A candle BODY is inside the zone (wick only is not valid)'],['liq','Reversal toward the other side: enter'],...RK],
'VOLUME PROFILE 3':[['htf','Volume profile drawn on the previous day'],['htf','Price moved out of VAH or VAL'],['bos','Pulled back to the zone leaving only wicks'],['liq','Break of structure formed: enter'],...RK],
'H&L LIQUIDITY GRAB':[['htf','Last high and last low marked'],['htf','Price is between the high and the low'],['bos','Price came to the high or the low'],['liq','Wicks or a strong pullback appeared: enter'],...RK],
'LEGACY':CK.map(([k,l])=>[k,l])};
function renderChecks(st,v){$('checks').innerHTML='<div class="k" style="margin-top:10px">Rules checklist</div>'+(STR[st]||STR.LEGACY).map(([g,l])=>'<label class="chk"><input type="checkbox" class="st" data-g="'+g+'"'+(v&&v[g]?' checked':'')+'>'+l+'</label>').join('')}
const MS={'Liquidity Sweep':'AMN MODEL'},MM={'No Liquidity Sweep':'Entered Before Trigger','Ignored BOS':'Entered Before Trigger','Early Entry':'Entered Before Trigger'};
const mig=t=>{const n={...t};if(MS[n.strat])n.strat=MS[n.strat];else if(n.strat&&!L.strat.includes(n.strat))n.strat='LEGACY';if(MM[n.mist])n.mist=MM[n.mist];return n};
const SF=[['name','Account name','text'],['start','Starting balance','number'],['daily','Daily goal','number'],['weekly','Weekly goal','number'],['monthly','Monthly goal','number'],['risk','Max risk % per trade','number'],['maxt','Max trades per day','number'],['maxloss','Max daily loss % of balance','number']];
const MULT={XAUUSD:100};
let S={name:'My Trading Account',start:50,daily:5,weekly:25,monthly:70,risk:10,maxt:3,maxloss:20},T=[],W=[],editId=null,idbOK=true;
const $=i=>document.getElementById(i);
const idb=new Promise((res,rej)=>{try{const r=indexedDB.open('tj',3);r.onupgradeneeded=()=>{const d=r.result,n=d.objectStoreNames;if(!n.contains('trades'))d.createObjectStore('trades',{keyPath:'id',autoIncrement:true});if(!n.contains('kv'))d.createObjectStore('kv');if(!n.contains('wd'))d.createObjectStore('wd',{keyPath:'id'});if(!n.contains('shots'))d.createObjectStore('shots',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});

const mn=v=>{if(!v)return null;const[h,m]=v.split(':').map(Number);return isNaN(h)||isNaN(m)?null:h*60+m},durMin=(a,b)=>{const x=mn(a),y=mn(b);if(x==null||y==null)return null;let d=y-x;if(d<0)d+=1440;return d},fmtD=m=>m<60?m+'m':Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';

function dayState(R){const ds=ymd(new Date()),bal=S.start+R.reduce((s,t)=>s+t.pl,0)-W.reduce((s,w)=>s+w.amt,0),mxl=bal*S.maxloss/100,dl=-R.filter(t=>t.date===ds&&t.pl<0).reduce((s,t)=>s+t.pl,0),a=R.filter(t=>t.date===ds).length;return{mxl,dl,ok:dl<mxl,full:a>=S.maxt}}
function calc(){const rows=[...T].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));let eq=S.start,pk=S.start,w=0,l=0;const cnt={};
 return rows.map(t=>{const m=MULT[t.pair],ok=m&&t.entry!=null&&t.sl!=null&&t.lot,risk=ok?Math.abs(t.entry-t.sl)*t.lot*m:null;
 const rr=t.entry!=null&&t.sl!=null&&t.tp!=null&&t.entry!==t.sl?Math.abs(t.tp-t.entry)/Math.abs(t.entry-t.sl):null;
 const rp=risk&&eq>0?risk/eq:null,res=t.pl>0?'Win':t.pl<0?'Loss':'BE';w=res==='Win'?w+1:0;l=res==='Loss'?l+1:0;eq+=t.pl;pk=Math.max(pk,eq);
 const sc=[t.htf,t.bos,t.liq,t.swp].filter(Boolean).length*25;
 const dn=(cnt[t.date]=(cnt[t.date]||0)+1),rsc=((rp!=null&&rp<=S.risk/100)+(t.mist==='None')+(dn<=S.maxt)+(sc>=75))/4;
 return{...t,dur:durMin(t.time,t.ctime),rsc,fol:rsc>=.75?'Yes':'No',sess:sessOf(t.time),risk,rp,rr,res,R:risk?t.pl/risk:null,score:sc,q:sc>=100?'A+':sc>=75?'A':sc>=50?'B':sc>=25?'C':'D',w,l,eq,dd:(pk-eq)/pk}})}
const sumD=(R,fn)=>R.filter(t=>fn(t.date)).reduce((s,t)=>s+t.pl,0);
function mission(R){const now=new Date(),dow=now.getDay();if(dow===0||dow===6)return{closed:true};
 const mon=new Date(now);mon.setDate(now.getDate()-(dow-1));let target=S.daily,mode='Start';
 for(let i=0;i<dow-1;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const n=sumD(R,x=>x===ymd(d));
  if(n>=target-1e-9){mode='Protect';target=n}else{mode='Recover';target=target-n}}

 $('strat').innerHTML='<h2>Strategy scorecard</h2>'+rows.map(r=>'<div class="tr" style="cursor:default"><span>'+r.nm+'<span class="tag">'+(r.n<10?r.n+'/10 trades':r.n+' trades')+'</span>'+(r.n?'<span class="tag">'+r.wp+'%</span><span class="tag">'+(r.ar==null?'–':r.ar.toFixed(2)+'R')+'</span>':'')+'</span><b class="'+cls(r.p)+'">'+(r.n?f(r.p):'–')+'</b></div>').join('')+'<div class="mut" style="margin-top:8px;font-size:13px">'+(best?'Best so far: '+best.nm:'Wait for 10 trades per strategy before judging it.')+'</div>'}
function render(){const R=calc(),m=mission(R),el=$('mission'),wsum=W.reduce((s,w)=>s+w.amt,0);renderAna(R);renderWd(wsum);renderStrat(R);renderRev();
 if(m.closed)el.innerHTML='<h2>Today\'s Mission</h2><div class="big">Market closed</div><div class="mut">See you Monday.</div>';
 else{const done=m.rem<=1e-9,fail=!done&&m.a>=S.maxt,p=l=>Math.round(m.rem*10/(l/0.01));
  el.innerHTML='<h2>Today\'s Mission · '+m.mode+'</h2><div class="big">'+f(m.target)+' target</div>'+(done?'<span class="win">Mission complete ✓</span>':fail?'<span class="loss">Mission failed — stop for today</span>':'<span class="amb">In progress</span>')+
  '<div class="row"><span class="mut">Collected today</span><b class="'+cls(m.n)+'">'+f(m.n)+'</b></div><div class="row"><span class="mut">Remaining</span><b>'+f(Math.max(m.rem,0))+'</b></div><div class="row"><span class="mut">Attempts</span><b>'+m.a+'/'+S.maxt+'</b></div><div class="dots">'+Array.from({length:S.maxt},(_,i)=>'<div class="dot'+(i<m.a?' on':'')+'"></div>').join('')+'</div>'+(done||fail?'':'<div class="row"><span class="mut">Pips needed</span><b>0.01 lot: '+p(0.01)+' · 0.02 lot: '+p(0.02)+'</b></div>')}
 const now=new Date(),ds=ymd(now),dw=now.getDay()||7,mo=new Date(now);mo.setDate(now.getDate()-(dw-1));const ms=ymd(mo);
 const tot=sumD(R,()=>true),wins=R.filter(t=>t.pl>0).length,dd=R.reduce((a,t)=>Math.max(a,t.dd),0),rs=R.filter(t=>t.R!=null),ar=rs.length?rs.reduce((s,t)=>s+t.R,0)/rs.length:null,last=R[R.length-1];
 const bar=(l,n,g)=>'<div class="row"><span>'+l+'</span><span><b class="'+cls(n)+'">'+f(n)+'</b> <span class="mut">/ '+f(g)+'</span></span></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,n/g*100))+'%"></i></div>';
 $('stats').innerHTML='<h2>'+S.name+'</h2><div class="grid"><div><div class="k">Balance</div><div class="v">'+f(S.start+tot-wsum)+'</div></div><div><div class="k">Win rate</div><div class="v">'+(R.length?Math.round(wins/R.length*100):0)+'%</div></div><div><div class="k">Max drawdown</div><div class="v">'+(dd*100).toFixed(1)+'%</div></div><div><div class="k">Avg R</div><div class="v">'+(ar==null?'–':ar.toFixed(2))+'</div></div><div><div class="k">Win streak</div><div class="v">'+(last?last.w:0)+'</div></div><div><div class="k">Trades</div><div class="v">'+R.length+'</div></div></div><div style="height:10px"></div>'+bar('Today',sumD(R,d=>d===ds),S.daily)+bar('This week',sumD(R,d=>d>=ms),S.weekly)+bar('This month',sumD(R,d=>d.slice(0,7)===ds.slice(0,7)),S.monthly);
 const bal=S.start+tot-wsum,mxl=bal*S.maxloss/100,dl=-R.filter(t=>t.date===ds&&t.pl<0).reduce((s,t)=>s+t.pl,0),ok=dl<mxl,rk=R.filter(t=>t.rp!=null).slice(-5),ra=rk.length?rk.reduce((s,t)=>s+t.rp,0)/rk.length:null,mm=S.risk/100,st=ra==null?'No data':ra<.5*mm?'Low':ra<mm?'Moderate':ra<1.5*mm?'Elevated':'High',rec={Low:'Trade normally',Moderate:'Stay disciplined',Elevated:'Reduce position size',High:'Stop trading today'}[st]||'Add entry, SL and lot to a trade',cs=last?(last.l>=5?'DANGER':last.w>=5?'ON FIRE':last.l>=3?'CAUTION':last.w>=3?'CONFIDENT':'NORMAL'):'NORMAL',wp=R.length?wins/R.length:0,wl=wp>=.7?'Elite':wp>=.6?'Strong':wp>=.5?'Stable':'Improve',rk2=(k,v,c)=>'<div><div class="k">'+k+'</div><div class="v '+(c||'')+'">'+v+'</div></div>';

 $('list').innerHTML=[...R].reverse().map(t=>'<div class="tr" data-id="'+t.id+'"><span>'+t.date.slice(5)+' '+t.time+(t.ctime?'→'+t.ctime:'')+' · '+t.pair+' '+t.dir+'<span class="tag">'+t.q+'</span>'+(t.dur!=null?'<span class="tag">'+fmtD(t.dur)+'</span>':'')+(t.sess?'<span class="tag">'+t.sess+'</span>':'')+(t.fol==='No'?'<span class="tag" style="color:var(--loss)">✗ rules</span>':'')+(t.R!=null?'<span class="tag">'+t.R.toFixed(1)+'R</span>':'')+(isPend(t)?'<span class="tag" style="color:var(--amb);border-color:var(--amb)">review</span>':'')+'</span><b class="'+cls(t.pl)+'">'+f(t.pl)+'</b></div>').join('')||'<div class="mut">No trades yet</div>';
