<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="Journal"><meta name="theme-color" content="#000000"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"><title>Trading Journal</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#111113;--tx:#fff;--mut:#bdbdc4;--ln:#2b2b30;--acc:#e11d2e;--acc2:#ff4150;--win:#2fd36b;--loss:#ff5a5f;--amb:#ffb020;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px/1.4 "Oswald",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:.02em;max-width:520px;padding:10px 14px 40px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;font-size:12.5px;padding:9px 2px;background:var(--card);color:var(--mut);border:1px solid var(--ln);margin:0}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:14px;color:var(--acc2);margin:0 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.1em}.big{font-size:26px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;margin:4px 0}
.mut{color:var(--mut)}.win{color:var(--win)}.loss{color:var(--loss)}.amb{color:var(--amb)}
.dots{display:flex;gap:6px;margin:6px 0}.dot{width:22px;height:8px;border-radius:4px;background:var(--ln)}.dot.on{background:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{font-size:12px;color:var(--mut)}.v{font-size:17px;font-weight:600}
input,select,button,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
button{background:var(--acc);color:#fff;border:0;font-weight:700;margin-top:10px}button.sec{background:var(--card);color:var(--tx);border:1px solid var(--ln)}button.del{background:none;color:var(--loss);border:1px solid var(--loss)}
label{font-size:12px;color:var(--mut)}.chk{display:flex;align-items:center;gap:8px;margin:6px 0}.chk input{width:auto}
.tr{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ln);font-size:14px;cursor:pointer}
.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--acc)}
.tag{font-size:11px;border:1px solid var(--ln);border-radius:6px;padding:0 5px;margin-left:4px;color:var(--mut)}
[hidden]{display:none!important}
</style></head><body>
<div class="tabs"><button data-t="home" class="on">Home</button><button data-t="trades">Trades</button><button data-t="ana">Analytics</button><button data-t="wd">Withdraw</button><button data-t="set">Settings</button></div>
<div id="home"><div class="card" id="mission"></div><div class="card" id="stats"></div></div>
<div id="trades" hidden><button id="new" style="margin:0 0 12px">+ Add trade</button><div class="card"><div id="list"></div></div></div>
<div id="form" hidden><div class="card"><h2 id="ftitle">Trade</h2><div class="grid" id="fields"></div><div id="checks"></div>
<div class="mut" id="calc" style="margin-top:8px"></div><button id="save">Save trade</button><button class="sec" id="cancel">Cancel</button><button class="del" id="del">Delete trade</button></div></div>
<div id="ana" hidden></div>
<div id="wd" hidden><div class="card"><h2>Add withdrawal</h2><div class="grid"><div><label>Date</label><input type="date" id="w_date"></div><div><label>Amount ($)</label><input type="number" id="w_amt" step="any" inputmode="decimal"></div></div><label>Note</label><input id="w_note"><button id="wadd">Save withdrawal</button></div><div class="card"><h2 id="wtot">Withdrawals</h2><div id="wlist"></div></div></div>
<div id="set" hidden><div class="card"><h2>Account and goals</h2><div class="grid" id="sfields"></div><button id="ssave">Save settings</button></div>
<div class="card"><h2>Backup</h2><textarea id="bk" rows="4" placeholder="Backup JSON appears here, or paste a backup to import"></textarea><button id="exp" class="sec">Show backup</button><button id="imp" class="sec">Import pasted backup</button></div></div>
<script>
const K=['date','time','pair','dir','strat','cond','entry','sl','tp','exit','lot','pl','emo','mist','htf','bos','liq','swp'];
const SEED=[].map(a=>Object.fromEntries(K.map((k,i)=>[k,a[i]])));
const L={pair:['XAUUSD','EURUSD','GBPUSD','USDJPY','NAS100','US30'],dir:['Buy','Sell'],sess:['','Asia','London','New York','Overlap'],strat:['Liquidity Sweep','FVG','CHOCH','BOS','Order Block','Breaker','Other'],cond:['Trending','Ranging','High Volatility','Low Volatility'],emo:['Calm','Confident','Patient','Brave','FOMO','Fear','Greed','Revenge','Hesitation'],mist:['None','FOMO Entry','Early Entry','Late Entry','Against HTF Bias','No Liquidity Sweep','Ignored BOS','RR Below 2','News Trade','Overtaking','Moved Stop Loss','Emotional Exit','Revenge Trade','Other']};
const FS=[['date','Date','date'],['time','Time','time'],['pair','Pair','sel'],['dir','Direction','sel'],['sess','Session','sel'],['strat','Strategy','sel'],['cond','Market condition','sel'],['emo','Emotion','sel'],['entry','Entry price','num'],['sl','Stop loss','num'],['tp','Take profit','num'],['exit','Exit price','num'],['lot','Lot size','num'],['pl','Profit / Loss ($)','num'],['mist','Mistake','sel']];
const CK=[['htf','HTF bias / trend'],['bos','Break of structure'],['liq','Liquidity'],['swp','Sweep liquidity']];
const SF=[['name','Account name','text'],['start','Starting balance','number'],['daily','Daily goal','number'],['weekly','Weekly goal','number'],['monthly','Monthly goal','number'],['risk','Max risk % per trade','number'],['maxt','Max trades per day','number']];
const MULT={XAUUSD:100};
let S={name:'My Trading Account',start:50,daily:5,weekly:25,monthly:70,risk:10,maxt:3},T=[],W=[],editId=null,idbOK=true;
const $=i=>document.getElementById(i);
const idb=new Promise((res,rej)=>{try{const r=indexedDB.open('tj',2);r.onupgradeneeded=()=>{const d=r.result,n=d.objectStoreNames;if(!n.contains('trades'))d.createObjectStore('trades',{keyPath:'id',autoIncrement:true});if(!n.contains('kv'))d.createObjectStore('kv');if(!n.contains('wd'))d.createObjectStore('wd',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const tx=async(st,mode,fn)=>{if(!idbOK)return;try{const d=await idb;return await new Promise((res,rej)=>{const t=d.transaction(st,mode),q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}catch(e){idbOK=false}};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const f=n=>(n<0?'-':'')+'$'+Math.abs(n).toFixed(2),cls=n=>n>0?'win':n<0?'loss':'mut';
const num=v=>v===''||v==null||isNaN(+v)?null:+v;
function calc(){const rows=[...T].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));let eq=S.start,pk=S.start,w=0,l=0;
 return rows.map(t=>{const m=MULT[t.pair],ok=m&&t.entry!=null&&t.sl!=null&&t.lot,risk=ok?Math.abs(t.entry-t.sl)*t.lot*m:null;
 const rr=t.entry!=null&&t.sl!=null&&t.tp!=null&&t.entry!==t.sl?Math.abs(t.tp-t.entry)/Math.abs(t.entry-t.sl):null;
 const res=t.pl>0?'Win':t.pl<0?'Loss':'BE';w=res==='Win'?w+1:0;l=res==='Loss'?l+1:0;eq+=t.pl;pk=Math.max(pk,eq);
 const sc=[t.htf,t.bos,t.liq,t.swp].filter(Boolean).length*25;
 return{...t,risk,rr,res,R:risk?t.pl/risk:null,score:sc,q:sc>=100?'A+':sc>=75?'A':sc>=50?'B':sc>=25?'C':'D',w,l,eq,dd:(pk-eq)/pk}})}
const sumD=(R,fn)=>R.filter(t=>fn(t.date)).reduce((s,t)=>s+t.pl,0);
function mission(R){const now=new Date(),dow=now.getDay();if(dow===0||dow===6)return{closed:true};
 const mon=new Date(now);mon.setDate(now.getDate()-(dow-1));let target=S.daily,mode='Start';
 for(let i=0;i<dow-1;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const n=sumD(R,x=>x===ymd(d));
  if(n>=target-1e-9){mode='Protect';target=n}else{mode='Recover';target=target-n}}
 const ds=ymd(now),n=sumD(R,x=>x===ds),a=R.filter(t=>t.date===ds).length;return{target,mode,n,a,rem:target-n}}
function render(){const R=calc(),m=mission(R),el=$('mission'),wsum=W.reduce((s,w)=>s+w.amt,0);renderAna(R);renderWd(wsum);
 if(m.closed)el.innerHTML='<h2>Today\'s Mission</h2><div class="big">Market closed</div><div class="mut">See you Monday.</div>';
 else{const done=m.rem<=1e-9,fail=!done&&m.a>=S.maxt,p=l=>Math.round(m.rem*10/(l/0.01));
  el.innerHTML='<h2>Today\'s Mission · '+m.mode+'</h2><div class="big">'+f(m.target)+' target</div>'+(done?'<span class="win">Mission complete ✓</span>':fail?'<span class="loss">Mission failed — stop for today</span>':'<span class="amb">In progress</span>')+
  '<div class="row"><span class="mut">Collected today</span><b class="'+cls(m.n)+'">'+f(m.n)+'</b></div><div class="row"><span class="mut">Remaining</span><b>'+f(Math.max(m.rem,0))+'</b></div><div class="row"><span class="mut">Attempts</span><b>'+m.a+'/'+S.maxt+'</b></div><div class="dots">'+Array.from({length:S.maxt},(_,i)=>'<div class="dot'+(i<m.a?' on':'')+'"></div>').join('')+'</div>'+(done||fail?'':'<div class="row"><span class="mut">Pips needed</span><b>0.01 lot: '+p(0.01)+' · 0.02 lot: '+p(0.02)+'</b></div>')}
 const now=new Date(),ds=ymd(now),dw=now.getDay()||7,mo=new Date(now);mo.setDate(now.getDate()-(dw-1));const ms=ymd(mo);
 const tot=sumD(R,()=>true),wins=R.filter(t=>t.pl>0).length,dd=R.reduce((a,t)=>Math.max(a,t.dd),0),rs=R.filter(t=>t.R!=null),ar=rs.length?rs.reduce((s,t)=>s+t.R,0)/rs.length:null,last=R[R.length-1];
 const bar=(l,n,g)=>'<div class="row"><span>'+l+'</span><span><b class="'+cls(n)+'">'+f(n)+'</b> <span class="mut">/ '+f(g)+'</span></span></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,n/g*100))+'%"></i></div>';
 $('stats').innerHTML='<h2>'+S.name+'</h2><div class="grid"><div><div class="k">Balance</div><div class="v">'+f(S.start+tot-wsum)+'</div></div><div><div class="k">Win rate</div><div class="v">'+(R.length?Math.round(wins/R.length*100):0)+'%</div></div><div><div class="k">Max drawdown</div><div class="v">'+(dd*100).toFixed(1)+'%</div></div><div><div class="k">Avg R</div><div class="v">'+(ar==null?'–':ar.toFixed(2))+'</div></div><div><div class="k">Win streak</div><div class="v">'+(last?last.w:0)+'</div></div><div><div class="k">Trades</div><div class="v">'+R.length+'</div></div></div><div style="height:10px"></div>'+bar('Today',sumD(R,d=>d===ds),S.daily)+bar('This week',sumD(R,d=>d>=ms),S.weekly)+bar('This month',sumD(R,d=>d.slice(0,7)===ds.slice(0,7)),S.monthly);
 $('list').innerHTML=[...R].reverse().map(t=>'<div class="tr" data-id="'+t.id+'"><span>'+t.date.slice(5)+' '+t.time+' · '+t.pair+' '+t.dir+'<span class="tag">'+t.q+'</span>'+(t.R!=null?'<span class="tag">'+t.R.toFixed(1)+'R</span>':'')+'</span><b class="'+cls(t.pl)+'">'+f(t.pl)+'</b></div>').join('')||'<div class="mut">No trades yet</div>';
 document.querySelectorAll('.tr').forEach(r=>r.onclick=()=>openForm(+r.dataset.id))}
$('fields').innerHTML=FS.map(([k,l,ty])=>'<div><label>'+l+'</label>'+(ty==='sel'?'<select id="f_'+k+'">'+L[k].map(o=>'<option>'+o+'</option>').join('')+'</select>':'<input id="f_'+k+'" type="'+(ty==='num'?'number':ty)+'"'+(ty==='num'?' step="any" inputmode="decimal"':'')+'>')+'</div>').join('');
$('checks').innerHTML=CK.map(([k,l])=>'<label class="chk"><input type="checkbox" id="f_'+k+'">'+l+'</label>').join('');
$('sfields').innerHTML=SF.map(([k,l,ty])=>'<div><label>'+l+'</label><input id="s_'+k+'" type="'+ty+'" step="any"></div>').join('');
function show(t){['home','trades','form','ana','wd','set'].forEach(x=>$(x).hidden=x!==t);document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===(t==='form'?'trades':t)));if(t==='set')FS&&SF.forEach(([k])=>$('s_'+k).value=S[k])}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));
function openForm(id){editId=id;const n=new Date(),t=T.find(x=>x.id===id)||{date:ymd(n),time:String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),pair:'XAUUSD',dir:'Buy',lot:0.01};
 FS.forEach(([k,,ty])=>$('f_'+k).value=t[k]==null?(ty==='sel'?L[k][0]:''):t[k]);CK.forEach(([k])=>$('f_'+k).checked=!!t[k]);
 $('ftitle').textContent=id?'Edit trade':'New trade';$('del').hidden=!id;$('calc').textContent='If P/L is empty, it is calculated from entry, exit and lot (XAUUSD).';show('form')}
$('new').onclick=()=>openForm(null);$('cancel').onclick=()=>show('trades');
$('save').onclick=async()=>{const t={};FS.forEach(([k,,ty])=>{const v=$('f_'+k).value;t[k]=ty==='num'?num(v):v});CK.forEach(([k])=>t[k]=$('f_'+k).checked);
 if(t.pl==null&&MULT[t.pair]&&t.entry!=null&&t.exit!=null&&t.lot)t.pl=+((t.dir==='Buy'?t.exit-t.entry:t.entry-t.exit)*t.lot*MULT[t.pair]).toFixed(2);
 if(t.pl==null){$('calc').textContent='Enter Profit / Loss, or entry, exit and lot for XAUUSD.';return}
 if(editId){t.id=editId;T=T.map(x=>x.id===editId?t:x)}else{t.id=Date.now();T.push(t)}
 await tx('trades','readwrite',s=>s.put(t));render();show('trades')};
$('del').onclick=async()=>{if(!confirm('Delete this trade?'))return;T=T.filter(x=>x.id!==editId);await tx('trades','readwrite',s=>s.delete(editId));render();show('trades')};
$('ssave').onclick=async()=>{SF.forEach(([k,,ty])=>{const v=$('s_'+k).value;S[k]=ty==='number'?(num(v)??S[k]):v});await tx('kv','readwrite',s=>s.put(S,'settings'));render();show('home')};
$('exp').onclick=()=>{$('bk').value=JSON.stringify({S,T,W});$('bk').select()};
$('imp').onclick=async()=>{try{const d=JSON.parse($('bk').value);if(!d.T||!d.S)throw 0;if(!confirm('Replace all data with this backup?'))return;S=d.S;T=d.T;W=d.W||[];await tx('wd','readwrite',s=>s.clear());for(const w of W)await tx('wd','readwrite',s=>s.put(w));await tx('trades','readwrite',s=>s.clear());for(const t of T)await tx('trades','readwrite',s=>s.put(t));await tx('kv','readwrite',s=>s.put(S,'settings'));render();show('home')}catch(e){alert('That backup could not be read.')}};
const grade=(w,p)=>w>=60&&p>0?'A':w>=50&&p>0?'B':w>=40?'C':'D';
function tbl(t,R,key,list){const rows=list.map(nm=>{const g=R.filter(x=>(x[key]||'Not set')===nm);if(!g.length)return'';const p=g.reduce((s,x)=>s+x.pl,0),wp=Math.round(g.filter(x=>x.pl>0).length/g.length*100);return'<div class="tr" style="cursor:default"><span>'+nm+'<span class="tag">'+g.length+' trades</span><span class="tag">'+wp+'%</span><span class="tag">'+grade(wp,p)+'</span></span><b class="'+cls(p)+'">'+f(p)+'</b></div>'}).join('');return'<div class="card"><h2>'+t+'</h2>'+(rows||'<div class="mut">No data</div>')+'</div>'}
function renderAna(R){if(!R.length){$('ana').innerHTML='<div class="card mut">No trades yet</div>';return}
 const wn=R.filter(t=>t.pl>0),ls=R.filter(t=>t.pl<0),gw=wn.reduce((s,t)=>s+t.pl,0),gl=-ls.reduce((s,t)=>s+t.pl,0),tot=gw-gl,rr=R.filter(t=>t.rr!=null),rs=R.filter(t=>t.R!=null),last=R[R.length-1];
 const mx=(a,fn,s)=>a.length?a.reduce((x,y)=>s*fn(y)>s*fn(x)?y:x):null,bw=mx(wn,t=>t.pl,1),bl=mx(ls,t=>t.pl,-1),br=mx(rs,t=>t.R,1),wr=mx(rs,t=>t.R,-1);
 const mo=sumD(R,d=>d.slice(0,7)===ymd(new Date()).slice(0,7));
 const kv=(k,v)=>'<div><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
 $('ana').innerHTML='<div class="card"><h2>Summary</h2><div class="grid">'+kv('Total trades',R.length)+kv('Win rate',Math.round(wn.length/R.length*100)+'%')+kv('Total profit',f(tot))+kv('Profit factor',gl?(gw/gl).toFixed(2):'–')+kv('Expectancy',f(tot/R.length))+kv('Average RR',rr.length?(rr.reduce((s,t)=>s+t.rr,0)/rr.length).toFixed(2):'–')+kv('Average win',wn.length?f(gw/wn.length):'–')+kv('Average loss',ls.length?f(-gl/ls.length):'–')+kv('Largest win',bw?f(bw.pl):'–')+kv('Largest loss',bl?f(bl.pl):'–')+kv('Best R',br?br.R.toFixed(2)+' ('+br.date.slice(5)+')':'–')+kv('Worst R',wr?wr.R.toFixed(2)+' ('+wr.date.slice(5)+')':'–')+'</div></div>'+
 tbl('Strategy',R,'strat',L.strat)+tbl('Session',R,'sess',L.sess.slice(1).concat('Not set'))+tbl('Emotion',R,'emo',L.emo)+tbl('Mistakes',R,'mist',L.mist)+
 '<div class="card"><h2>Goal and risk</h2><div class="grid">'+kv('Monthly goal',Math.round(mo/S.monthly*100)+'%')+kv('Month profit',f(mo))+kv('Win streak',last.w)+kv('Loss streak',last.l)+kv('Drawdown now',(last.dd*100).toFixed(1)+'%')+kv('Max risk / trade',S.risk+'%')+'</div></div>'}
function renderWd(sum){$('wtot').textContent='Total withdrawn '+f(sum);$('wlist').innerHTML=[...W].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>'<div class="tr" data-wid="'+w.id+'"><span>'+w.date+' · '+(w.note||'')+'</span><b>'+f(w.amt)+'</b></div>').join('')||'<div class="mut">None yet</div>';
 document.querySelectorAll('[data-wid]').forEach(r=>r.onclick=async()=>{if(!confirm('Delete this withdrawal?'))return;const id=+r.dataset.wid;W=W.filter(w=>w.id!==id);await tx('wd','readwrite',s=>s.delete(id));render()})}
$('w_date').value=ymd(new Date());
$('wadd').onclick=async()=>{const a=num($('w_amt').value);if(!a||a<=0)return;const w={id:Date.now(),date:$('w_date').value,amt:a,note:$('w_note').value};W.push(w);await tx('wd','readwrite',s=>s.put(w));$('w_amt').value='';$('w_note').value='';render()};
(async()=>{const s=await tx('kv','readonly',s=>s.get('settings'));let t=await tx('trades','readonly',s=>s.getAll());
 if(s)S={...S,...s};
 if(!t||!t.length){const seeded=await tx('kv','readonly',s=>s.get('seeded'));if(!seeded){t=SEED.map((x,i)=>({...x,id:i+1}));for(const x of t)await tx('trades','readwrite',s=>s.put(x));await tx('kv','readwrite',s=>s.put(1,'seeded'))}else t=[]}
 T=t||SEED.map((x,i)=>({...x,id:i+1}));W=(await tx('wd','readonly',s=>s.getAll()))||[];if(!W.length&&!(await tx('kv','readonly',s=>s.get('wseeded')))){await tx('kv','readwrite',s=>s.put(1,'wseeded'))}render()})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
